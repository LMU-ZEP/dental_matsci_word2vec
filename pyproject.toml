[project]
name = "dental-word2vec-pipeline"
version = "1.0.0"
description = "Reproducible diachronic Word2Vec analysis pipeline for dental materials literature"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "gensim>=4.3",
  "ijson>=3.2",
  "matplotlib>=3.8",
  "nltk>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pypdf>=4.0",
  "PyMuPDF>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "spacy>=3.7",
]

[project.optional-dependencies]
visualization = [
  "umap-learn>=0.5",
]
legacy-pdf = [
  "PyPDF2>=3.0",
]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
